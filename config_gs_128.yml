# GS baseline -- K=128 Gaussians, full Kodak 24 images
# Densification+pruning enabled: starts at 32 Gaussians, grows up to 128 total.
# primary_samples=32, backup_samples=96 => max capacity = 128 Gaussians.
dataset:
  path: ./kodak
  image_size: [256, 256]
  selection_mode: full

experiment:
  output_dir: ./results/gs_fullkodak_k128
  save_plots: false
  save_renders: true
  save_raw_data: true
  plot_interval: 100
  run_diagnostics: false
  diagnostic_n_std: 2.0

em:
  enabled: false
  n_components: 128
  covariance_type: full
  max_iter: 500

gaussian_splatting:
  enabled: true
  primary_samples: 32
  backup_samples: 96
  num_epochs: 500
  learning_rate: 0.01
  kernel_size: 33
  lambda_dssim: 0.2
  densification: true
  densification_interval: 10
  gradient_threshold: 0.001
  gaussian_threshold: 0.7
  pruning: true

hybrid_residual:
  enabled: false

metrics:
  compute_lpips: false
