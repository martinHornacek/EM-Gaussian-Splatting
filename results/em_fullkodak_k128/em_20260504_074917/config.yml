dataset:
  image_list:
  - 15
  image_size:
  - 256
  - 256
  path: ./kodak
  random_count: 5
  selection_mode: full
em:
  covariance_type: full
  enabled: true
  max_iter: 500
  minibatch:
    min_samples: 5000
    subsample_ratio: 0.15
  n_components: 128
  variants:
  - minibatch
experiment:
  diagnostic_n_std: 2.0
  output_dir: ./results/em_fullkodak_k128
  plot_interval: 100
  run_diagnostics: false
  save_plots: false
  save_raw_data: false
  save_renders: true
gaussian_splatting:
  backup_samples: 0
  densification: false
  densification_interval: 10
  enabled: false
  gaussian_threshold: 1.2
  gradient_threshold: 0.01
  kernel_size: 33
  lambda_dssim: 0.2
  learning_rate: 0.01
  num_epochs: 200
  primary_samples: 128
  pruning: false
hybrid_residual:
  correction_mode: signed
  enabled: false
  max_iter: 14
  n_init: 64
  n_per_iter: 32
  n_total: 128
  oracle_clamp: false
  residual_threshold: 0.0001
metrics:
  compute_lpips: false
