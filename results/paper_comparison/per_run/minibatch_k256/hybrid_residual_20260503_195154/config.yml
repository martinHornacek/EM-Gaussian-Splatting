dataset:
  image_list:
  - 15
  image_size:
  - 256
  - 256
  path: ./kodak
  random_count: 5
  selection_mode: full
device: cpu
em:
  covariance_type: full
  enabled: true
  max_iter: 100
  minibatch:
    min_samples: 5000
    subsample_ratio: 0.15
experiment:
  output_dir: results\paper_comparison\per_run\minibatch_k256
  run_diagnostics: false
  save_plots: false
  save_raw_data: false
  save_renders: true
gaussian_splatting:
  enabled: false
  lambda_dssim: 0.2
hybrid_residual:
  compare_pure_em: true
  em_variant: minibatch
  enabled: true
  gd:
    enabled: false
  max_iter: 14
  n_init: 32
  n_per_iter: 16
  n_total: 256
  oracle_clamp: false
  residual_threshold: 0.0001
  step_size: 0.5
  use_minibatch: true
  visualize:
    enabled: false
    fps: 2
    make_gif: false
    make_mp4: false
metrics:
  compute_lpips: false
