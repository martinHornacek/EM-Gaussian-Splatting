# GS baseline -- K=1024 Gaussians, full Kodak 24 images
# Densification+pruning enabled: starts at 256 Gaussians, grows up to 1024 total.
# primary_samples=256, backup_samples=768 => max capacity = 1024 Gaussians.
dataset:
  path: ./kodak
  image_size: [256, 256]
  selection_mode: full

experiment:
  output_dir: ./results/gs_fullkodak_k1024
  save_plots: false
  save_renders: true
  save_raw_data: true
  plot_interval: 100
  run_diagnostics: false
  diagnostic_n_std: 2.0

em:
  enabled: false
  n_components: 1024
  covariance_type: full
  max_iter: 500

gaussian_splatting:
  enabled: true
  primary_samples: 256
  backup_samples: 768
  num_epochs: 1000
  learning_rate: 0.01
  kernel_size: 33
  lambda_dssim: 0.2
  densification: true
  densification_interval: 10
  gradient_threshold: 0.01
  gaussian_threshold: 1.2
  pruning: true

hybrid_residual:
  enabled: false

metrics:
  compute_lpips: false
