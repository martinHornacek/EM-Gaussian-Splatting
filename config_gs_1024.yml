# GS baseline — K=1024 Gaussians, full Kodak 24 images
# Fixed budget (no densification/pruning) for fair comparison with EM one-shot K=1024

dataset:
  path: "./kodak"
  image_size: [256, 256]
  selection_mode: "full"

experiment:
  output_dir: ./results/gs_fullkodak_k1024
  save_plots: false
  save_renders: true
  save_raw_data: true
  plot_interval: 100
  run_diagnostics: false
  diagnostic_n_std: 2.0

em:
  enabled: false
  n_components: 1024
  covariance_type: full
  max_iter: 500
  minibatch:
    subsample_ratio: 0.15
    min_samples: 5000

gaussian_splatting:
  enabled: true
  primary_samples: 1024
  backup_samples: 0
  num_epochs: 500
  learning_rate: 0.01
  kernel_size: 33
  lambda_dssim: 0.2
  densification: false
  densification_interval: 10
  gradient_threshold: 0.01
  gaussian_threshold: 1.2
  pruning: false

hybrid_residual:
  enabled: false
  n_total: 1024
  n_init: 64
  n_per_iter: 32
  max_iter: 14
  residual_threshold: 0.0001
  oracle_clamp: false
  correction_mode: "signed"

metrics:
  compute_lpips: false
