# Hybrid residual — K=2048, full Kodak 24 images, 256×256
# Run: python run_hybrid_residual.py --config config_hybrid_k2048.yml
# n_total=2048, n_init=256 (12.5%), 14 iters × 128 per iter

dataset:
  path: "./kodak"
  image_size: [256, 256]
  selection_mode: "full"
  random_count: 5
  image_list: [15]

experiment:
  output_dir: ./results/hybrid_fullkodak_k2048
  save_plots: false
  save_renders: true
  save_raw_data: false
  plot_interval: 50
  run_diagnostics: false
  diagnostic_n_std: 2.0

em:
  enabled: true
  n_components: 2048
  covariance_type: full
  max_iter: 500
  minibatch:
    subsample_ratio: 0.15
    min_samples: 5000

gaussian_splatting:
  enabled: false
  primary_samples: 2048
  backup_samples: 0
  num_epochs: 200
  learning_rate: 0.01
  kernel_size: 33
  lambda_dssim: 0.2
  densification: false
  densification_interval: 10
  gradient_threshold: 0.01
  gaussian_threshold: 1.2
  pruning: false

hybrid_residual:
  enabled: true
  n_total: 2048
  n_init: 256              # 12.5% seed
  n_per_iter: 128          # (2048 - 256) / 14 = 128
  max_iter: 14
  residual_threshold: 0.0001
  step_size: 0.5
  em_variant: "standard"
  use_minibatch: false
  compare_pure_em: false
  visualize:
    enabled: false
    fps: 2
    make_mp4: false
    make_gif: false
    n_std_ellipse: 2.0

metrics:
  compute_lpips: false
